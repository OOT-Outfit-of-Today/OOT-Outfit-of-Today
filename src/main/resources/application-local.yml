# ================================================================
# 데이터베이스 연결 설정
# ================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: create-drop

  # ================================================================
  # SQL 초기화 설정(data.sql 초기 데이터 자동 삽입 설정)
  # ================================================================
  sql:
    init:
      # data.sql 항상 실행
      mode: always
      encoding: UTF-8
      # 에러 발생 시 중단(데이터 무결성 보장)
      continue-on-error: false

  # ================================================================
  # Redis 연결 설정(로컬용 Lettuce 연결 풀)
  # ================================================================
  # host, port, password는 RedisConfig가 환경변수에서 직접 읽음
  data:
    redis:
      lettuce:
        pool:
          # 로컬은 dev보다 적은 연결 수 사용
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ================================================================
  # Spring Cache 설정 - Redis로 사용
  # ================================================================
  cache:
    redis:
      # local 환경 키 접두사
      key-prefix: "oot:local:cache:"

  # ================================================================
  # AWS 설정(로컬용)
  # ================================================================
  cloud:
    aws:
      # Parameter Store 비활성화(로컬에서는 .env 파일 사용)
      parameter-store:
        enabled: false
      region:
        # .env에서 자동으로 읽음
        static: ${AWS_REGION}
      credentials:
        # 로컬 개발용 AWS 자격증명
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      s3:
        bucket: ${AWS_S3_BUCKET}
        # Spring Cloud AWS 3.x에서 더 이상 지원 안 함
      # stack:
        # auto: false  # CloudFormation 비활성화

# ================================================================
# 서버 포트 설정
# ================================================================
server:
  port: 8080