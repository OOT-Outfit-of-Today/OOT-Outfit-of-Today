# ================================================================
# Spring Boot 설정
# ================================================================
spring:
  application:
    name: aws-demo
  profiles:
    # 환경변수 우선, 없으면 local 프로파일 사용
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ================================================================
  # .env 파일 로드 설정
  # ================================================================
  config:
    # optional: 파일이 없어도 애플리케이션 시작 가능
    # .env 파일을 properties 형식으로 읽어옴
    import: optional:file:.env[.properties]

  # ================================================================
  # DB 설정
  # ================================================================
  # 데이터소스 드라이버 공통 정의
  datasource:
    # dev, local 등 모든 프로파일에서 driver 중복 선언 방지
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA 공통 정책
  jpa:
    # JPA 초기화(데이블 생성) 후 data.sql 실행하도록 순서 보장
    defer-datasource-initialization: true
    # SQL 콘솔 출력 설정
    show-sql: true
    properties:
      hibernate:
        # SQL 포맷팅(가독성 향상)
        format_sql: true
        # Dialect 명시(DB 방언 설정)
        # 없으면 Hibernate가 자동 감지하나, 명시하는 게 더 안전
        dialect: org.hibernate.dialect.MySQLDialect

  # ================================================================
  # SQL 초기화 설정(data.sql 초기 데이터 자동 삽입 설정)
  # ================================================================
  sql:
    init:
      # 기본값을 안전하게 설정 -> data.sql 실행은 각 프로파일에서 설정
      mode: never

  # ================================================================
  # Redis 설정(Spring Boot 자동 설정 활용)
  # ================================================================
  data:
    redis:
      # .env에서 가져오는 민감정보
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      # JPA Repository 자동 생성 비활성화(수동 설정 사용)
      repositories:
        enabled: false
      # Redis 명령 실행 타임아웃
      timeout: 3s
      lettuce:
        pool:
          # 커넥션 획득 대기 타임아웃(-1ms: 무제한)
          max-wait: 2s

  # ================================================================
  # Spring Cache 설정(Spring이 관리)
  # ================================================================
  cache:
    type: redis
    redis:
      # null 값 캐싱 방지
      cache-null-values: false
      # 캐시 키 접두사 사용
      use-key-prefix: true
      # 기본 TTL(1시간)
      time-to-live: 3600000

  # ================================================================
  # Jackson JSON 직렬화 설정
  # ================================================================
  jackson:
    # JSON 응답에서 null 제외 -> 응답 크기 감소 효과
    default-property-inclusion: non_null

  # ================================================================
  # 파일 업로드 설정
  # ================================================================
  servlet:
    multipart:
      # S3 이미지 업로드 크기 제한
      max-file-size: 5MB
      max-request-size: 5MB

  # ================================================================
  # Spring Batch 설정
  # ================================================================
  # Spring Batch 자동 실행 방지(스케줄러로 Job 수동 실행)
  # 없으면 애플리케이션 시작 시 배치 Job이 자동 실행되어 의도치 않은 동작 발생
  batch:
    job:
      # 스케줄러를 통한 수동 실행만 허용(자동 실행 방지)
      enabled: false
    jdbc:
      # 배치 메타데이터 테이블 자동 생성
      initialize-schema: always

  # ================================================================
  # OAuth2 소셜 로그인 설정
  # ================================================================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # OAuth2 리다이렉트 URI 패턴
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code

        provider:
          google:
            # Google 로그인 화면 URL(계정 선택 프롬프트 포함)
            # prompt 파라미터를 URL에 직접 추가
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
            # 로그인 완료 후 서버가 Google에게 Access Token 전송 요청을 보내는 URL
            token-uri: https://www.googleapis.com/oauth2/v4/token
            # 발급받은 token으로 사용자 정보(email, name 등) 조회 URL
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            # 사용자 정보 중 고유 식별자로 쓸 필드명(sub = Google의 unique user id)
            user-name-attribute: sub

# ================================================================
# JWT 설정
# ================================================================
jwt:
  # 사용자당 최대 동시 로그인 디바이스 수
  max-devices-per-user: 5

# ================================================================
# OAuth 설정
# ================================================================
oauth:
  # OAuth 임시 코드 TTL(코드에서 사용)
  temp-code-ttl-minutes: 3

# ================================================================
# CORS 설정
# ================================================================
cors:
  # 허용할 프론트엔드 Origin(환경별 override 필요)
  allowed-origins: http://localhost:3000

# ================================================================
# 프론트엔드 URL
# ================================================================
frontend:
  # 프론트엔드 베이스 URL(리다이렉트 등에 사용)
  url: http://localhost:3000

# ================================================================
# 카카오 맵 API 설정
# ================================================================
kakao:
  map:
    api-key: ${KAKAO_MAP_API_KEY}
    base-url: https://dapi.kakao.com

# ================================================================
# 토스 결제 API 설정
# ================================================================
toss:
  # TODO: 커스텀 프로퍼티이므로 @ConfigurationProperties로 매핑하는 Configuration 클래스 생성해야 함
  secret-key: ${TOSS_SECRET_KEY}
  api:
    url:
      # 결제 승인 API 엔드포인트
      confirm: https://api.tosspayments.com/v1/payments/confirm

# ================================================================
# 커스텀 Cache TTL 설정
# ================================================================
cache:
  ttl:
    # 사용자 정보 캐시 (10분)
    user: 10m
    # 사용자 존재 여부 캐시 (1분, 빈번한 조회)
    user-exists: 1m
    # 판매 게시글 목록 캐시 (10분)
    sale-post-list: 10m
    # 대시보드 관리자용 캐시 (3분)
    dashboard-admin: 3m
    # 대시보드 사용자 요약 (25시간, 일 단위 통계)
    dashboard-user-summary: 25h
    # 대시보드 착용 통계 (25시간, 일 단위 통계)
    dashboard-user-wear-statistics: 25h

# ================================================================
# Redisson 설정(분산 락용)
# ================================================================
redisson:
  # 유휴 연결 타임아웃(10초)
  idle-connection-timeout: 10s
  # 재시도 횟수
  retry-attempts: 3
  # 재시도 간격(1.5초)
  retry-interval: 1500ms

# ================================================================
# 서버 설정
# ================================================================
server:
  # 포트는 환경별로 다르므로 공통에서는 제거 -> dev/local/prod yml 프로파일에서 설정
  # port: 8080

  # Context Path 설정(API 경로 접두사)
  servlet:
    context-path: /api

    # OAuth2 세션 관리 - 세션 쿠키 보안 설정
    # 없으면 OAuth2 로그인 과정에서 세션이 유실되어 로그인 실패
    session:
      cookie:
        # CSRF 공격 방지(Lax: 일반적인 GET 요청은 허용)
        same-site: lax
        # HTTPS에서만 전송
        # 환경별 override(로컬(HTTP)=false, 프로덕션(HTTPS)=true)) 필요 -> 각 프로파일에서 변경
        secure: ${COOKIE_SECURE:false}
        # XSS 공격 방지(JavaScript 접근 차단)
        http-only: true
        # 쿠키 경로
        path: /
        # 쿠키 유효 시간(30분, OAuth2 완료까지 충분)
        max-age: 1800
      # 세션 타임아웃
      timeout: 30m

# ================================================================
# Swagger UI 설정
# ================================================================
springdoc:
  api-docs:
    # API 문서 생성 활성화
    enabled: true
  swagger-ui:
    # Swagger UI 활성화
    enabled: true
    # Swagger UI 접근 경로
    path: /swagger-ui.html
    # 요청 소요 시간 표시
    display-request-duration: true
    # Try it out 버튼 활성화
    try-it-out-enabled: true

# ================================================================
# Actuator & Prometheus 모니터링
# ================================================================
management:
  endpoints:
    web:
      # Actuator 엔드포인트 베이스 경로
      base-path: /actuator
      # Prometheus 메트릭 노출
      exposure:
        # Prometheus 추가(모니터링용)
        include: health,info,prometheus

  endpoint:
    health:
      # 보안 강화: 인증된 사용자만 상세 정보 조회
      show-details: when-authorized

  # 매트릭 설정
  metrics:
    tags:
      # 모니터링 시스템에서 애플리케이션 구분용 태그
      application: OOT-observability
    distribution:
      percentiles-histogram:
        # HTTP 요청 히스토그램 활성화(응답 시간 분포 수집)
        http.server.requests: true

# ================================================================
# 로깅 설정
# ================================================================
logging:
  level:
    root: INFO
    # Spring Web 요청/응답 로그
    org.springframework.web: DEBUG
    # 환경 변수 및 프로퍼티 로딩 과정 로그
    org.springframework.core.env: DEBUG
    org.springframework.boot.context.config: DEBUG
    # HikariCP 커넥션 풀 로그
    com.zaxxer.hikari: DEBUG